name: Expand Tayi source archive
on:
  push:
    branches: [main]
    paths:
      - ".tayi-transfer/READY"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode and expand project
        run: |
          set -euo pipefail
          cat .tayi-transfer/part*.b64 | base64 --decode > /tmp/tayi.zip
          unzip -t /tmp/tayi.zip
          mkdir /tmp/tayi-expanded
          unzip -q /tmp/tayi.zip -d /tmp/tayi-expanded
          test -d /tmp/tayi-expanded/tayi
          cp -a /tmp/tayi-expanded/tayi/. .
          rm -rf .tayi-transfer .tayi-source.zip.b64
          rm -f .github/workflows/expand-tayi.yml
      - name: Commit project source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: add Tayi application source"
          git push origin main
